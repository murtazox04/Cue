{{- if not .Values.database.existingSecret }}
{{- if not .Values.database.url }}
{{- fail "set database.url or database.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cue.fullname" . }}-database
  labels:
    {{- include "cue.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.database.url | quote }}
{{- end }}
