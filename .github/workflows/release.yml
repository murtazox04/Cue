name: Release

on:
  push:
    tags: ["v*"]
  # Also runnable by hand (or by an automation with workflow access): it then creates
  # the tag and the GitHub release itself.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.1 (must match src/cue_notify/__init__.py)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  verify:
    name: Check the tag matches the version
    runs-on: ubuntu-latest
    steps:
      - name: Refuse manual releases from other branches
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error::manual releases run only from $DEFAULT_BRANCH, not $REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare tag and package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/cue_notify/__init__.py)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package version $version"
            exit 1
          fi
      - name: Refuse to re-release an existing version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists"
            exit 1
          fi

  pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing — no API token stored in the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false # nothing cached may reach what we publish
      - run: uv build
      # Publishes with PEP 740 attestations, so installers can check where it was built.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  image:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # signs the build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      # Verify with: gh attestation verify oci://ghcr.io/murtazox04/cue:<version> -R murtazox04/Cue
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/murtazox04/cue # registry names are lowercase
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Create GitHub release
    needs: [pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        # The release may already exist when it was drafted on GitHub to create the tag:
        # keep what was written there and add the changelog below it.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            intro=$(gh release view "$TAG" --json body -q .body)
            if [ -n "$intro" ]; then
              { printf '%s\n\n## Changelog\n' "$intro"; cat notes.md; } > full.md
              mv full.md notes.md
            fi
            gh release edit "$TAG" --notes-file notes.md
          else
            # Creates the tag at the released commit when run by hand.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Cue $TAG" --notes-file notes.md
          fi

  mcp-registry:
    name: Update the MCP registry
    needs: pypi
    permissions:
      id-token: write # GitHub OIDC login to the registry
      contents: read
    uses: ./.github/workflows/mcp-registry.yml
