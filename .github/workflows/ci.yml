name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk-python:
    name: Python SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run pytest
      - run: uv run pyright

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    name: Tests (Python ${{ matrix.python }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.13'
        with:
          name: coverage-sqlite
          path: coverage.xml

  test-postgres:
    name: Tests (Python 3.13, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cue
          POSTGRES_PASSWORD: cue
          POSTGRES_DB: cue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cue"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CUE_TEST_DATABASE_URL: postgresql+asyncpg://cue:cue@localhost:5432/cue_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - run: uv run pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: cue:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  quickstart:
    name: Quick start (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build -d
      - name: Wait for the API
        run: timeout 120 bash -c 'until curl -fs localhost:8000/healthz; do sleep 2; done'
      - name: Walk through the getting-started guide
        run: |
          key=$(docker compose exec -T api cuectl keys create admin | grep -o 'ck_[A-Za-z0-9_-]*')
          CUE_KEY="$key" scripts/smoke.sh
      - if: failure()
        run: docker compose logs

  helm:
    name: Helm chart (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - run: helm lint --strict deploy/helm/cue --set database.url=postgresql+asyncpg://x
      - uses: helm/kind-action@v1
      - name: Build the image into the cluster
        run: |
          docker build -t cue:ci .
          kind load docker-image cue:ci --name chart-testing
      - name: Start PostgreSQL
        run: |
          kubectl create deployment postgres --image=postgres:17-alpine --port=5432
          kubectl set env deployment/postgres POSTGRES_USER=cue POSTGRES_PASSWORD=cue POSTGRES_DB=cue
          kubectl expose deployment postgres --port=5432
          kubectl rollout status deployment/postgres --timeout=180s
      - name: Install the chart
        run: |
          helm install cue deploy/helm/cue --wait --timeout 5m \
            --set image.repository=cue --set image.tag=ci --set image.pullPolicy=Never \
            --set database.url=postgresql+asyncpg://cue:cue@postgres:5432/cue
      - name: Walk through the getting-started guide
        run: |
          key=$(kubectl exec deploy/cue-api -- cuectl keys create admin | grep -o 'ck_[A-Za-z0-9_-]*')
          kubectl port-forward svc/cue 8000:80 &
          timeout 60 bash -c 'until curl -fs localhost:8000/healthz; do sleep 2; done'
          CUE_KEY="$key" scripts/smoke.sh
      - if: failure()
        run: |
          kubectl get pods -A
          kubectl logs deploy/cue-api --all-containers --tail=100 || true
          kubectl logs deploy/cue-worker --all-containers --tail=100 || true

