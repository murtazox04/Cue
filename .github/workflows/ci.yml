name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk-python:
    name: Python SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run pytest
      - run: uv run pyright

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  audit:
    name: Dependency & workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Known vulnerabilities in the server's locked dependencies
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project -q > server.txt
          uvx pip-audit@2.10.1 -r server.txt --no-deps --disable-pip --progress-spinner off
      - name: Known vulnerabilities in the Python SDK's locked dependencies
        working-directory: sdks/python
        run: |
          # Its dev tools include the server from this checkout, audited above.
          uv export --frozen --all-extras --no-hashes --no-emit-project -q | grep -v '^-e ' > sdk.txt
          uvx pip-audit@2.10.1 -r sdk.txt --no-deps --disable-pip --progress-spinner off
      - name: Known vulnerabilities in the TypeScript SDK
        working-directory: sdks/typescript
        run: npm audit --audit-level=moderate
      - name: Workflow security (zizmor)
        # Low-severity hints (style suggestions) are reported but don't fail the build.
        run: uvx zizmor@1.30.1 --min-severity medium --format github .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    name: Tests (Python ${{ matrix.python }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-extras
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.13'
        with:
          name: coverage-sqlite
          path: coverage.xml

  test-postgres:
    name: Tests (Python 3.13, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: cue
          POSTGRES_PASSWORD: cue
          POSTGRES_DB: cue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cue"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CUE_TEST_DATABASE_URL: postgresql+asyncpg://cue:cue@localhost:5432/cue_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - run: uv run pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: cue:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  quickstart:
    name: Quick start (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose up --build -d
      - name: Wait for the API
        run: timeout 120 bash -c 'until curl -fs localhost:8000/healthz; do sleep 2; done'
      - name: Walk through the getting-started guide
        run: |
          key=$(docker compose exec -T api cuectl keys create admin | grep -o 'ck_[A-Za-z0-9_-]*')
          CUE_API_KEY="$key" scripts/smoke.sh
      - if: failure()
        run: docker compose logs

  helm:
    name: Helm chart (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm lint --strict deploy/helm/cue --set database.url=postgresql+asyncpg://x
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - name: Build the image into the cluster
        run: |
          docker build -t cue:ci .
          kind load docker-image cue:ci --name chart-testing
      - name: Start PostgreSQL
        run: |
          kubectl create deployment postgres --image=postgres:17-alpine --port=5432
          kubectl set env deployment/postgres POSTGRES_USER=cue POSTGRES_PASSWORD=cue POSTGRES_DB=cue
          kubectl expose deployment postgres --port=5432
          kubectl rollout status deployment/postgres --timeout=180s
      - name: Install the chart
        run: |
          helm install cue deploy/helm/cue --wait --timeout 5m \
            --set image.repository=cue --set image.tag=ci --set image.pullPolicy=Never \
            --set database.url=postgresql+asyncpg://cue:cue@postgres:5432/cue
      - name: Walk through the getting-started guide
        run: |
          key=$(kubectl exec deploy/cue-api -- cuectl keys create admin | grep -o 'ck_[A-Za-z0-9_-]*')
          kubectl port-forward svc/cue 8000:80 &
          timeout 60 bash -c 'until curl -fs localhost:8000/healthz; do sleep 2; done'
          CUE_API_KEY="$key" scripts/smoke.sh
      - if: failure()
        run: |
          kubectl get pods -A
          kubectl logs deploy/cue-api --all-containers --tail=100 || true
          kubectl logs deploy/cue-worker --all-containers --tail=100 || true

