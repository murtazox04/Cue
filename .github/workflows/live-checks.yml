name: Live checks

# Calls real third-party APIs with repository secrets. Run by hand.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Screening API base URL (empty: TypeSafe's own)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  typesafe:
    name: TypeSafe screening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Check that the key reached the job
        run: test -n "$TYPESAFE_API_KEY" || { echo "::error::TYPESAFE_API_KEY is not a repository Actions secret"; exit 1; }
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - run: uv run pytest tests/live -v -s
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_BASE_URL: ${{ inputs.base_url || secrets.TYPESAFE_BASE_URL }}
