name: Live checks

# Calls real third-party APIs with repository secrets. Run by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typesafe:
    name: TypeSafe screening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/live -v -s
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
