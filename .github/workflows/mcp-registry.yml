name: MCP registry

# Lists (or updates) Cue in the official MCP registry from server.json. Runs after a
# release, once the package is on PyPI; can also be started by hand.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry; no token stored
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" \
            | tar xz mcp-publisher
      - name: Check server.json matches the released version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/cue_notify/__init__.py)
          grep -q "\"version\": \"$version\"" server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
