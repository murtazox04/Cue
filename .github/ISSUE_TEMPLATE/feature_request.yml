name: Feature request
description: Suggest an improvement or a new channel
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Cue to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
