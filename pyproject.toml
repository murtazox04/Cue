[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cue-notify"
dynamic = ["version"]
description = "Self-hosted notification decision engine: quiet hours, time zones, digests, frequency caps and preferences in front of the sender you already have."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Murtazo Xurramov" }]
requires-python = ">=3.12"
keywords = [
  "notifications",
  "notification-engine",
  "rules-engine",
  "event-driven",
  "push",
  "sms",
  "email",
  "fcm",
  "twilio",
  "messaging",
  "fastapi",
  "llm",
  "mcp",
  "ai-agents",
  "attention",
  "preference-center",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy[asyncio]>=2.0.40",
  "alembic>=1.16",
  "aiosqlite>=0.21",
  "httpx>=0.28",
  "jinja2>=3.1.6",
  "typer>=0.16",
  # The MCP server is core: agents are first-class senders (`cuectl mcp`).
  "mcp>=2.0",
]

[project.optional-dependencies]
# PostgreSQL driver — recommended for production.
postgres = ["asyncpg>=0.30"]
# Firebase Cloud Messaging (service-account OAuth signing).
fcm = ["pyjwt[crypto]>=2.10"]
# Apple Push Notification service: HTTP/2 and ES256 token signing.
apns = ["pyjwt[crypto]>=2.10", "h2>=4.1"]
# Amazon SES: verifying the SNS notifications that carry bounces and complaints.
ses = ["cryptography>=44"]
# AI copy personalisation through any Pydantic AI provider.
ai = ["pydantic-ai-slim[openai,anthropic,google,groq,mistral]>=2.0"]
# Prometheus metrics endpoint.
metrics = ["prometheus-client>=0.21"]
# Kept so `cue-notify[mcp]` from older docs still resolves; the MCP server is now core.
mcp = []
all = ["cue-notify[postgres,fcm,apns,ses,ai,metrics]"]

[project.scripts]
cuectl = "cue_notify.cli:main"
# Same CLI under the package name, so `uvx cue-notify mcp` works for MCP clients.
cue-notify = "cue_notify.cli:main"

[project.urls]
Homepage = "https://github.com/murtazox04/Cue"
Documentation = "https://murtazox04.github.io/Cue"
Repository = "https://github.com/murtazox04/Cue"
Issues = "https://github.com/murtazox04/Cue/issues"
Changelog = "https://github.com/murtazox04/Cue/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.0",
  "ruff>=0.12",
  "pyright>=1.1.400",
  "pre-commit>=4.2",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6"]

[tool.hatch.version]
path = "src/cue_notify/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cue_notify"]

[tool.hatch.build.targets.sdist]
include = ["src/cue_notify", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "sdks/python/src"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "RUF",      # ruff-specific
  "ASYNC",    # async pitfalls
  "S",        # bandit (security)
  "PT",       # pytest style
  "PTH",      # pathlib
  "TC",       # type-checking imports
  "DTZ",      # timezone-aware datetimes
  "LOG", "G", # logging
  "N",        # naming
  "ERA",      # commented-out code
]
ignore = [
  "S101",   # assert is fine in tests and for type narrowing
  "TC001", "TC002", "TC003", # FastAPI/Pydantic resolve annotations at runtime
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S311", "PT018", "DTZ001"]
"sdks/python/tests/**" = ["S105", "S106"]
"src/cue_notify/db/migrations/**" = ["N999"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Security"]

# --------------------------------------------------------------------------- pyright

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error::DeprecationWarning:cue.*"]
markers = ["postgres: requires a PostgreSQL database (CUE_TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["cue_notify"]
branch = true
# SQLAlchemy's asyncio layer runs ORM code inside greenlets.
concurrency = ["greenlet", "thread"]
omit = ["src/cue_notify/db/migrations/env.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
