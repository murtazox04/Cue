site_name: Cue
site_description: "Self-hosted notification decision engine: quiet hours, time zones, digests, frequency caps and preferences in front of the sender you already have"
site_url: https://murtazox04.github.io/Cue/
repo_url: https://github.com/murtazox04/Cue
repo_name: murtazox04/Cue
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.superfences:
      custom_fences:
        - { name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Events and rules: concepts/events-and-rules.md
      - Templates: concepts/templates.md
      - Delivery policy: concepts/policy.md
      - Importance and expiry: concepts/importance.md
      - Digests: concepts/digests.md
      - Preference centre: concepts/preferences.md
      - Agents: concepts/agents.md
      - Approval requests: concepts/approvals.md
      - Channels: concepts/channels.md
      - Broadcasts: concepts/broadcasts.md
      - Engagement tracking: concepts/engagement.md
      - AI personalisation: concepts/ai.md
  - Guides:
      - Deployment: guides/deployment.md
      - Performance: guides/performance.md
      - Compliance: guides/compliance.md
      - Custom channels: guides/custom-channels.md
      - SDKs: guides/sdks.md
      - AI agents (MCP): guides/ai-agents.md
      - Coding agents: guides/coding-agents.md
  - Reference:
      - Configuration: reference/configuration.md
      - HTTP API: reference/api.md
      - API key scopes: reference/scopes.md
      - Statuses and reasons: reference/statuses.md
      - CLI: reference/cli.md
  - Architecture: architecture.md
  - Notes:
      - Quiet hours are harder than they look: notes/quiet-hours.md
